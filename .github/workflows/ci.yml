name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A nightly run, for the `supply-chain` and `e2e` jobs' sake. Everything
  # else here is a function of a commit, so running it on a commit is
  # sufficient - but an advisory is published by someone else, against code
  # that has not changed, so a check that only ever fires when we push
  # cannot see one arrive. This is the trigger that makes the supply-chain
  # job an actual tripwire rather than a slower way of learning the same
  # thing at merge time.
  #
  # This was `'0 6 * * 1'` (weekly, Monday) until 2026-09-07, when EOP-220
  # wired the Playwright end-to-end suite in and needed a nightly cadence
  # (ADR-072). It is one cron rather than two because the `e2e` job declares
  # `needs: [image]` - it can only run in a graph that has already built the
  # images, which is this workflow, so an `e2e`-only schedule is not
  # available without duplicating the build. Every scheduled job therefore
  # gained frequency; none lost any, and on a public repository Actions
  # minutes are free, so the cost of the extra six runs a week is wall-clock
  # on GitHub's infrastructure and nothing else.
  #
  # The other jobs run too. That is deliberate and not a side effect worth
  # suppressing: a nightly green on `build`, `ui` and `image` is a canary
  # for breakage that arrives from outside the repository - a base image
  # moving, an action deprecating, a registry changing - which is otherwise
  # discovered by whoever happens to push next. Nothing is published,
  # because the GHCR step is gated on `github.event_name == 'push'`.
  schedule:
    - cron: '0 6 * * *'
  # Manual trigger, so the audit can be run on demand after a pin moves, or
  # the end-to-end suite re-run against the current `main`, without waiting
  # for tomorrow morning or inventing a commit.
  workflow_dispatch:

# Least privilege, stated explicitly. The repository default is already
# `read`, so this changes nothing today - but it means a job added later
# cannot quietly inherit more than it needs, and it makes the one job that
# does need write scope declare it locally.
permissions:
  contents: read

jobs:
  # One of the four required status checks on `main`, and the only one that
  # compiles anything: `sonar-ratchet` and `sonar-ratchet-ui` joined it on
  # 2026-09-04 (ADR-060 as amended) and `dependency-cve` on 2026-09-05
  # (ADR-050 as amended). It was the sole required check until the first of
  # those dates, so treat any comment in this file still saying so as stale
  # rather than as a second opinion. Keep it fast and keep it about the code.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      # Cache the local Maven repository so dependency downloads do not
      # dominate build time. The key includes the pom.xml hash so the cache
      # is invalidated automatically when dependencies change. The restore-key
      # falls back to any prior Maven cache for the same OS, which still saves
      # most of the download time even after a pom.xml change.
      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # The Maven Wrapper, not a system `mvn`. The wrapper pins the Maven
      # version; `mvn` is whatever the runner image happens to ship.
      - name: Build and test
        run: ./mvnw verify --batch-mode

      # `./mvnw verify` cannot gate its own output: surefire binds to `test`,
      # which runs before `package`, so no JUnit test can inspect the
      # repackaged jar. This step is therefore the only thing standing between
      # a lost `<excludes>` block in `pom.xml` and H2's 13 `org.h2.server.web`
      # classes going back inside the artifact that runs on a server. It sits
      # before `Upload artifact` on purpose, so nothing unverified is published,
      # and inside `build` because that is the required check that compiles
      # the artifact in question - the other three required checks are the two
      # Sonar ratchets and `dependency-cve`, and not one of them builds a jar,
      # so not one of them could host this assertion.
      # See docs/adr/ADR-047-h2-excluded-from-deployable-artifact.md.
      - name: Assert no H2 in the deployable artifact
        run: tools/artifact/assert-no-h2-in-jar.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-jar
          path: target/*.jar

  # The front end gets its own gate rather than being bolted onto `build`.
  # Two reasons: `build` is the required check that protects `main` by
  # compiling and testing the Java - three further required checks stand
  # beside it, listed in the `build` header - so it should stay Java-only and
  # fast and must not fail for a lint rule in
  # a TypeScript file; and a front-end failure should report as a front-end
  # failure rather than as a mysterious red mark on the Java job.
  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `ci`, not `install`: it installs exactly the locked tree and fails
      # if the lockfile and the manifest disagree, rather than silently
      # resolving something new.
      - name: Install dependencies
        run: npm ci

      # Four separate steps rather than the chained `npm run verify`, so a
      # failure names itself in the job summary instead of hiding inside
      # one opaque command.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `coverage`, not `test`. `vitest run --coverage` runs the same suite
      # and additionally writes `ui/coverage/lcov.info`, so this is the test
      # step with a report attached rather than an extra step - running both
      # would execute 259 tests twice for one artefact.
      #
      # Nothing in CI consumes that LCOV: the SonarQube scan needs a live
      # server, which this pipeline deliberately does not have (ADR-060), so
      # the front-end scan is a local operation exactly as the Java one is.
      # The step earns its place by failing here rather than on a developer's
      # machine - a coverage provider that stops resolving, or a config edit
      # that emits nothing, is caught on the pull request that causes it
      # instead of the next time someone runs `tools/sonar/scan-ui.sh` and
      # gets a report claiming 0%. See ADR-063.
      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

  # Deliberately NOT a required status check yet. It lands as an ordinary
  # job so its reliability can be observed over a few runs; promoting it
  # to required is a separate, deliberate branch-protection change.
  #
  # Gated on both code jobs: this one publishes both images, so neither
  # should be published unless both quality gates passed.
  image:
    name: image
    needs: [ build, ui ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only to publish to GHCR, and only by this job. No
      # repository secret is involved: the built-in GITHUB_TOKEN is
      # enough, which is why this repository still has zero secrets.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # linux/amd64 explicitly. The instance is t3.small, which is x86_64,
      # and a developer laptop on Apple Silicon would otherwise produce an
      # arm64 image that cannot run there. Only CI publishes the image that
      # gets deployed.
      - name: Build application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: eop-threat-modeling:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # The proxy image. It carries the built front end and the Caddy
      # configuration, so it is the only thing that publishes a port
      # (ADR-017). Its own build context is `ui/`, which keeps the
      # front-end build out of the application image entirely.
      - name: Build front-end image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ui
          platforms: linux/amd64
          load: true
          tags: eop-ui:ci
          # All three are build-time flags (ADR-037). The ARG defaults in
          # ui/Dockerfile are false (fail-closed); these explicit overrides
          # enable the game screen, the card magnifier and the follow-suit hint
          # in the CI-built and deployed image. Change any to false to ship that
          # feature dark.
          build-args: |
            VITE_GAME_SCREEN_ENABLED=true
            VITE_CARD_MAGNIFIER_ENABLED=true
            VITE_FOLLOW_SUIT_HINT_ENABLED=true
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      # The `e2e` job runs the Playwright suite against *these* images rather
      # than rebuilding from source, which is what makes it a test of the
      # artifact we would ship (EOP-220, ADR-072). Jobs do not share a Docker
      # daemon, so the images have to travel as an artifact: `docker save`
      # here, `docker load` there.
      #
      # GHCR is not the vehicle, even though the push steps below already put
      # these images there. That push is gated on `github.event_name ==
      # 'push'`, so on the nightly schedule and on `workflow_dispatch` there
      # would be nothing to pull but the previous commit's `:latest` - the
      # `e2e` job would silently test a stale artifact and still report green.
      # An artifact is the only channel that carries the images built by *this
      # run* on every event that runs the suite.
      #
      # Skipped on pull requests because the `e2e` job does not run on them
      # (see that job's `if:`), so saving and uploading ~300 MB there would be
      # pure cost. `docker save` streams into gzip rather than writing an
      # uncompressed tar first; the runner has the disk either way, but the
      # upload is what dominates.
      - name: Save images for the end-to-end job
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p image-export
          docker save eop-threat-modeling:ci | gzip > image-export/app.tar.gz
          docker save eop-ui:ci | gzip > image-export/ui.tar.gz
          ls -lh image-export

      - name: Upload images for the end-to-end job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-images
          path: image-export/
          # Long enough to download in the same run and to inspect a failure
          # the next morning; short because these are large and reproducible
          # from the commit.
          retention-days: 3

      # Nothing before this point proves the artifact starts. `mvn verify`
      # proves the code compiles and the tests pass; the build proves the
      # image assembles. This proves the application boots, runs Liquibase
      # against a real PostgreSQL and serves traffic - which is what makes
      # the walking skeleton honest.
      - name: Smoke test
        env:
          APP_IMAGE: eop-threat-modeling:ci
          UI_IMAGE: eop-ui:ci
          POSTGRES_DB: eop
          POSTGRES_USER: eop
          # Ephemeral, lives for the duration of one job, reachable only
          # from inside the Compose network. Not a secret.
          POSTGRES_PASSWORD: smoke-test-throwaway
        run: |
          set -euo pipefail

          docker compose -f compose.app.yml up -d

          # Port 443 through Caddy (EOP-21; was port 80). The application container
          # publishes no host port at all (ADR-017), so this is the only way in —
          # which is exactly why the test goes this way: hitting the application
          # directly would prove the application works and prove nothing about the
          # proxy that every real request passes through.
          #
          # The Caddy local CA certificate is self-signed (tls internal). curl's
          # --insecure flag disables certificate verification, which is acceptable
          # in CI where the goal is to prove the stack starts and serves traffic,
          # not to validate the certificate chain. The hostname must be `localhost`
          # (not 127.0.0.1) because the site address is `localhost:8080` and Caddy
          # only presents the certificate for that SNI name.
          healthy=false
          for _ in $(seq 1 60); do
            if [ "$(curl -fsSk https://localhost/health 2>/dev/null || true)" = "OK" ]; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "::error::The stack never served OK on /health through the proxy"
            docker compose -f compose.app.yml ps
            docker compose -f compose.app.yml logs --no-color
            exit 1
          fi

          echo "GET /health returned OK through the proxy"

          # The site root must serve the front end, not fall through to the
          # API. A proxy that answers /health but 404s the site would pass
          # the check above and still be broken for every user.
          root_status="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)"
          if [ "$root_status" != 200 ]; then
            echo "::error::The site root returned $root_status, expected 200"
            docker compose -f compose.app.yml logs --no-color caddy
            exit 1
          fi

          echo "GET / returned 200"

          # And the API must be reachable on the same origin. This is the
          # single-origin property from ADR-017 asserted rather than
          # assumed - if it regressed, the browser would need CORS.
          if ! curl -fsSk 'https://localhost/api/v1/cards?size=1' | grep -q '"totalElements":68'; then
            echo "::error::The card catalogue was not reachable through the proxy"
            docker compose -f compose.app.yml logs --no-color
            exit 1
          fi

          echo "GET /api/v1/cards returned the seeded deck"

      # Run k6 performance regression canary as per ADR-055
      # This check uses relaxed CI-specific thresholds to account for 2-vCPU runner jitter
      # while still catching gross regressions (N+1, missing index, 50x slowdown).
      # Raw results are uploaded as an artifact for debugging a specific regression.
      # The per-run headline figures are rendered into the run summary by the step
      # after this one, and pushes to `main` additionally append one row to the
      # trend series in the `perf-trend` job below (ADR-055 as amended by EOP-169).
      #
      # Do NOT append CI results to docs/performance/TRENDS.md. These are two
      # separate populations and mixing them would make both meaningless: TRENDS.md
      # tracks hand-curated baselines measured on a developer Mac via Colima against
      # a t3.small-bound topology, whereas everything below is measured on a 2-vCPU
      # shared GitHub runner. The CI series is only ever comparable with itself.
      - name: Run k6 performance regression canary
        run: |
          set -euo pipefail

          RESULTS="${{ github.workspace }}/test/k6/results"
          mkdir -p "$RESULTS"

          # --user keeps the container writing as the runner user, so the results
          # directory needs no relaxed permissions. The image runs as uid 12345
          # (k6) by default and could not otherwise write into a 0755 host mount.
          # /scripts is mounted read-only; only /results is writable.
          #
          # Two digest-pinning traps, both verified with `docker buildx imagetools
          # inspect` (ADR-055): the tag is `2.2.0` and NOT `v2.2.0`, and the digest
          # below is the OCI image *index* digest. Pinning a per-platform
          # sub-manifest instead would fail on this x86_64 runner with "no matching
          # manifest for linux/amd64", and `docker inspect` on an arm64 developer
          # machine reports a third digest again -- never derive the pin there.
          #
          # --network joins Caddy's own network namespace rather than the host's
          # (EOP-160, ADR-055 amendment 2026-09-04). `--network host` handed the
          # container every host port, every loopback service on the runner and the
          # ability to bind host ports, when the only access k6 needs is outbound to
          # one proxy. `eop-caddy` is the fixed container_name in compose.app.yml,
          # so the target is deterministic. The port is 8080 because Caddy listens
          # unprivileged inside the container; Compose maps that to 443 on the host,
          # and the host's ports do not exist in this namespace.
          #
          # The address must be `localhost`, and that is a TLS constraint rather
          # than a preference. ui/Caddyfile serves `tls internal` for exactly
          # `localhost, 127.0.0.1, [::1]`, and a non-empty SNI outside that set
          # aborts the handshake server-side with `tlsv1 alert internal error`.
          # `default_sni` does not rescue it, and --insecure-skip-tls-verify is
          # client-side so it cannot either -- which rules out `https://caddy:8080`
          # by Compose service name. An IP literal (`https://172.28.0.10:8080`)
          # does handshake, because Go omits SNI for IP literals, but its Host
          # header then matches no site block and returns an empty 200 instead of
          # /health.
          #
          # Residual, stated rather than implied: k6 can still reach app:8080 and
          # postgres:5432 directly over the Compose network, bypassing the proxy.
          # That was equally true under `--network host`, which could route to the
          # same 172.28.0.0/24 subnet, so this is a narrowing with no new reach.
          # Two scenarios, two invocations, two summary exports (EOP-156).
          # health-check.js loads a static string that touches no database, no
          # repository and no business code, so on its own the canary could not
          # catch the N+1 query, missing index or 50x slowdown that ADR-055 gives
          # as its motivation. card-catalogue.js adds a request that crosses
          # Postgres, the Liquibase schema, the catalogue query, JPA mapping and
          # Page<T> serialisation.
          #
          # Deliberately not merged into one script or one k6 run.
          # http_req_duration is a single aggregate metric, so measuring both
          # endpoints together would dilute a cards regression behind health's
          # much faster responses. Keeping them apart also keeps the trend series
          # honest: perf-trend reads summary.json, and every point recorded in
          # ci-history.jsonl so far measures /health alone, so widening what that
          # one file covers would introduce a step change caused by scope rather
          # than by code. health therefore keeps the unprefixed filenames and
          # cards is written beside it. The artifact uploads the whole results
          # directory, so both exports arrive with no further wiring.
          #
          # Declared once and shared by both invocations: a second
          # EXPECTED_THRESHOLD_COUNT= assignment would shadow this one, which
          # K6ThresholdCouplingTest (EOP-158) fails the build over. Tied to
          # test/k6/config/options-ci.js, where http_req_duration carries
          # `p(95) < 500` and `max < 2000` and http_req_failed carries
          # `rate < 0.001`. Move the two together: a mismatch fails here by design,
          # which is what stops a renamed or deleted threshold going unnoticed.
          # Both scenarios import the same THRESHOLDS_CI, so this is a count per
          # summary export and not a total across the two.
          EXPECTED_THRESHOLD_COUNT=3

          run_canary() {
            local script="$1"
            local prefix="$2"
            local k6_exit=0

            echo "--- k6 scenario: $script ---"

            docker run --network "container:eop-caddy" \
              --user "$(id -u):$(id -g)" \
              -v "${{ github.workspace }}/test/k6:/scripts:ro" \
              -v "$RESULTS:/results" \
              -e K6_ENV=ci \
              -e BASE_URL=https://localhost:8080 \
              grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6 \
              run --insecure-skip-tls-verify \
              --out "json=/results/${prefix}raw.json" \
              --summary-export "/results/${prefix}summary.json" \
              "/scripts/$script" || k6_exit=$?

            # Two independent signals. k6's own exit code is captured above rather
            # than left to `set -e`, so the summary assertion below always runs; the
            # exit code alone is not sufficient, as the InfluxDB write failure
            # recorded in ADR-016 logs one error per flush interval and still exits 0.
            local summary="$RESULTS/${prefix}summary.json"

            if [[ ! -s "$summary" ]]; then
              echo "::error::k6 summary export is missing or empty: $summary"
              return 1
            fi

            if ! jq -e 'type == "object" and has("metrics")' "$summary" >/dev/null; then
              echo "::error::$script summary export is not a JSON object carrying a .metrics key"
              return 1
            fi

            # Flatten every threshold in the document rather than naming each one.
            # Hardcoding `.thresholds."p(95) < 500"` would silently disarm this gate
            # the moment that string changed in options-ci.js: `jq -r` emits `null`
            # for a missing key, which is not "true", so the breach test would pass
            # forever. In this export a threshold value of `false` means NOT
            # breached. Note http_req_failed also reports "passes": 0, "fails": 221
            # on a fully healthy run -- an inverted Rate metric whose real error rate
            # lives in "value" -- so the threshold booleans are the only sound signal.
            local thresholds
            thresholds=$(jq -r '
              .metrics
              | to_entries[]
              | select(.value.thresholds != null)
              | . as $m
              | $m.value.thresholds
              | to_entries[]
              | "\($m.key)\t\(.key)\t\(.value)"
            ' "$summary")

            local actual_count
            actual_count=$(printf '%s\n' "$thresholds" | grep -c . || true)
            if [[ "$actual_count" -ne "$EXPECTED_THRESHOLD_COUNT" ]]; then
              echo "::error::Expected $EXPECTED_THRESHOLD_COUNT thresholds in the $script summary, found $actual_count -- has options-ci.js changed?"
              printf '%s\n' "$thresholds"
              return 1
            fi

            local breached=0
            local metric threshold value
            while IFS=$'\t' read -r metric threshold value; do
              case "$value" in
                false)
                  echo "  PASS  $metric  $threshold"
                  ;;
                true)
                  echo "::error::Threshold breached in $script: $metric $threshold"
                  breached=1
                  ;;
                *)
                  echo "::error::Non-boolean threshold result in $script for $metric $threshold: '$value'"
                  breached=1
                  ;;
              esac
            done <<< "$thresholds"

            if [[ "$breached" -ne 0 ]]; then
              return 1
            fi

            if [[ "$k6_exit" -ne 0 ]]; then
              echo "::error::k6 exited $k6_exit for $script although every exported threshold passed -- inspect the k6-results artifact"
              return 1
            fi

            echo "All $EXPECTED_THRESHOLD_COUNT k6 thresholds passed for $script"
          }

          # Both scenarios always run, even when the first breaches, so the
          # artifact and the run summary describe the whole run that went red --
          # the same reasoning as the `if: always()` render step below.
          #
          # errexit is suppressed inside a function invoked as the left operand of
          # `||`, so every failure path in run_canary is an explicit `return 1`
          # rather than a bare command left to `set -e`. The one unguarded command
          # is the jq filling `thresholds`; a failure there leaves the variable
          # empty, which the count comparison rejects.
          failures=0
          run_canary health-check.js "" || failures=$((failures + 1))
          run_canary card-catalogue.js "cards-" || failures=$((failures + 1))

          if [[ "$failures" -ne 0 ]]; then
            echo "::error::$failures of 2 k6 canary scenarios failed"
            exit 1
          fi

      # Rendered in a step of its own rather than appended to the step above, and
      # deliberately `if: always()`. The k6 step `exit 1`s the instant a threshold
      # is breached, so anything appended after that gate would be skipped in
      # precisely the run whose numbers someone needs to see. The `-s` guard keeps
      # this step green and quiet when k6 never got as far as writing a summary
      # (stack failed to come up, image pull failed), because a missing summary is
      # already reported as a hard error by the step above -- failing here as well
      # would only add noise to a run that has already gone red for the real reason.
      - name: Render k6 metrics to the run summary
        if: always()
        run: |
          set -euo pipefail

          RESULTS="${{ github.workspace }}/test/k6/results"

          # Key spellings verified against a real export before use: the document
          # is flat, with no `.values` wrapper at any level. `http_req_failed` is
          # an inverted Rate whose real figure is `.value` -- its `passes`/`fails`
          # read 0/221 on a fully healthy run, so those two are never rendered.
          # `p(50)`/`p(95)`/`p(99)` exist only because both scenarios ask for them
          # in `summaryTrendStats`; they are not k6 defaults.
          rendered=0

          render_summary() {
            local summary="$1"
            local heading="$2"

            if [[ ! -s "$summary" ]]; then
              echo "No k6 summary export at $summary -- nothing to render for $heading"
              return 0
            fi

            jq -r --arg heading "$heading" '
              .metrics as $m
              | "### k6 performance canary -- \($heading)",
                "",
                "| Metric | Value |",
                "| --- | --- |",
                "| p50 latency | \($m.http_req_duration["p(50)"] * 100 | round / 100) ms |",
                "| p95 latency | \($m.http_req_duration["p(95)"] * 100 | round / 100) ms |",
                "| p99 latency | \($m.http_req_duration["p(99)"] * 100 | round / 100) ms |",
                "| max latency | \($m.http_req_duration.max * 100 | round / 100) ms |",
                "| Requests / sec | \($m.http_reqs.rate * 100 | round / 100) |",
                "| Error rate | \($m.http_req_failed.value * 10000 | round / 100)% |",
                "| Iterations | \($m.iterations.count) |",
                "| Checks passed | \($m.checks.passes)/\($m.checks.passes + $m.checks.fails) |",
                ""
            ' "$summary" >> "$GITHUB_STEP_SUMMARY"

            rendered=$((rendered + 1))
          }

          # One table per scenario rather than one merged table, for the same
          # reason the two scenarios are measured separately in the step above: a
          # single set of figures spanning a static string and a database-backed
          # page would describe neither endpoint (EOP-156).
          render_summary "$RESULTS/summary.json" "GET /health"
          render_summary "$RESULTS/cards-summary.json" "GET /api/v1/cards?size=1"

          if [[ "$rendered" -eq 0 ]]; then
            echo "No k6 summary exports found -- nothing to render"
            exit 0
          fi

          {
            echo "Measured on a 2-vCPU GitHub runner against the Compose stack through Caddy."
            echo "Not comparable with the local baselines in \`docs/performance/TRENDS.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-results
          path: test/k6/results/

      # Tear down by project name with no `-f`. That is deliberate and is the
      # reason this step needs no credentials at all: `compose.app.yml`
      # declares POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD with the
      # fail-hard `${VAR:?}` form, so passing `-f` would make Compose refuse
      # to *parse* the file whenever they are unset - even for `down`, which
      # needs none of their values. Resolving the stack by its `name: eop-app`
      # project label instead skips parsing entirely, so no database
      # credentials enter this step (security.md, least privilege).
      #
      # Verified: `docker compose -p eop-app down --volumes` removes all three
      # containers, the network and both named volumes, and does not touch the
      # separate `eop-monitoring` stack declared in docker-compose.yml.
      - name: Tear down stack
        if: always()
        run: docker compose -p eop-app down --volumes

      # Publish only from `main`. A pull request builds and smoke tests the
      # image but never publishes one, so an unreviewed change can never
      # become a deployable tag.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # GHCR rejects uppercase in a repository path. This one is
          # already lowercase; the guard costs nothing and survives a
          # rename.
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # The commit SHA is the immutable, deployable reference - it is
          # what `app_image` and `ui_image` in infra/terraform.tfvars should
          # point at. `latest` is a convenience for humans and moves under
          # you.
          #
          # Two images, both tagged with the same SHA, because they are
          # deployed together and a mismatched pair is a class of bug worth
          # making impossible to express.
          for tag in "${{ github.sha }}" latest; do
            docker tag eop-threat-modeling:ci "$repo:$tag"
            docker push "$repo:$tag"

            docker tag eop-ui:ci "$repo-ui:$tag"
            docker push "$repo-ui:$tag"
          done

          echo "Published $repo:${{ github.sha }}"
          echo "Published $repo-ui:${{ github.sha }}"

  # Appends one row per merged commit to a long-lived k6 trend series and
  # republishes the static page that renders it (EOP-169, amending ADR-055
  # section 5, which originally stopped at "artifact only, not for trend
  # analysis"). The artifact answers "why is this build slow?"; this job
  # answers "when did it get slow?", which an artifact expiring in 90 days
  # and downloadable one zip at a time cannot.
  #
  # A separate job rather than a step in `image`, for one hard reason:
  # `permissions` in GitHub Actions is job-scoped, with no per-step
  # granularity. Appending from inside `image` would mean widening that
  # job's `contents: read` to `contents: write` for every step in it,
  # including the two that authenticate to GHCR and push published images.
  # Splitting keeps this the only job in the workflow that can write to the
  # repository, and it holds no `packages` scope at all (security.md, least
  # privilege). It also costs nothing: it consumes the `k6-results` artifact
  # the `image` job already uploads, so k6 still runs exactly once, in the
  # place ADR-055 section 1 put it, against the already-running stack.
  #
  # `needs: image` means a red canary never records a data point, so a
  # breached threshold cannot enter the series and depress the baseline.
  e2e-report:
    name: e2e-report
    needs: e2e
    # Pushes to `main` only. `github.event_name == 'push'` is load-bearing
    # and not redundant with the ref test: `workflow_dispatch` and the weekly
    # `schedule` trigger both report `refs/heads/main` too, and a scheduled
    # re-run of unchanged code would otherwise append a duplicate point for
    # a commit already in the series. A pull request must never append -
    # the code is unmerged, so a point recorded against it describes a state
    # of the tree that may never exist on `main`.
    #
    # `success()` is belt-and-braces rather than load-bearing, and is written
    # out for the reader: because this `if:` names no status function, the
    # implicit `needs` success requirement already applies, so a failing
    # `e2e` job skips this one. Stating it makes EOP-221 Scenario 3 - never
    # publish a failing run - legible at the point it is enforced, rather
    # than resting on knowledge of a GitHub default. Do not "simplify" it
    # away; and never write `always()` or `failure()` here, which would
    # disable that requirement and publish failures.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One of two jobs in this workflow that can write to the repository - the
    # other is `perf-trend` - and both write only to `perf-history`, a branch
    # that holds no code.
    permissions:
      contents: write
    # Serialise this series against itself, and never cancel: two merges in
    # quick succession would race on the push, and the queued run carries a
    # data point that is not recoverable if dropped, because the artifact it
    # reads is scoped to its own workflow run.
    #
    # Deliberately a *different* group from `perf-trend`, which means the two
    # jobs can and will run concurrently on the same commit and race on the
    # push to `perf-history`. That race is reconciled by the retry loop below
    # rather than by serialising the two, because they write disjoint paths -
    # `perf-trend` owns the branch root, this job owns `e2e/` - so a loser
    # simply replays its append onto the winner's tip with nothing to merge.
    concurrency:
      group: e2e-report
      cancel-in-progress: false
    steps:
      # Needed only for tools/e2e/report-page.html. The report series itself
      # lives on the orphan branch and is fetched separately below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download E2E results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-results
          path: e2e-results

      # Reads the artifact, never the workspace.
      - name: Extract report row
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          RESULTS="e2e-results/results.json"

          if [[ ! -s "$RESULTS" ]]; then
            echo "::error::$RESULTS missing or empty in the e2e-results artifact -- the E2E suite passed but exported nothing, so the report series cannot be appended to"
            ls -R e2e-results || true
            exit 1
          fi

          # `results.json` is a single object, not an array of runs. Checked
          # explicitly so a truncated or HTML-error-page download fails here
          # with a clear message rather than yielding `null` metrics that the
          # row validation below would then reject more obscurely.
          if ! jq -e 'type == "object"' "$RESULTS" >/dev/null; then
            echo "::error::$RESULTS is not a valid JSON object"
            exit 1
          fi

          # Field names mirror Playwright's own `.stats` vocabulary
          # (`expected`/`unexpected`, not `passed`/`failed`) so a reader can
          # map a row back to the export without a translation table, and so
          # this row agrees with the `e2e` job's run-summary step, which reads
          # the same keys. `duration` is converted to whole seconds because
          # that is what the page renders; the raw export is milliseconds.
          row="$(jq -c \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha "$COMMIT_SHA" \
            --arg run_id "$RUN_ID" '
              {
                date: $date,
                sha: $sha,
                run_id: $run_id,
                expected: (.stats.expected // 0),
                unexpected: (.stats.unexpected // 0),
                flaky: (.stats.flaky // 0),
                skipped: (.stats.skipped // 0),
                duration: (((.stats.duration // 0) / 1000) | floor)
              }
            ' "$RESULTS")"

          # Fail loudly on a partial row rather than committing nulls.
          #
          # The numeric checks are wrapped in an array and tested with
          # `all(...)` deliberately. The obvious spelling - a bare comma form
          # such as `(.expected, .unexpected | type == "number")` - produces a
          # *stream* of booleans, and `jq -e` takes its exit status from the
          # last value only, so a null in any non-final position exits 0 and
          # the bad row is committed. `perf-trend` carries the same note and
          # the same shape; the behaviour was confirmed by negative test.
          if ! printf '%s' "$row" | jq -e '
                ([.expected, .unexpected, .flaky, .skipped, .duration]
                  | all(type == "number" and (isnan or isinfinite | not)))
                and (.sha | test("^[0-9a-f]{40}$"))
                and (.run_id | test("^[0-9]+$"))
                and (.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              ' >/dev/null; then
            echo "::error::extracted row failed validation -- a metric key has probably moved in the results.json export"
            printf '%s\n' "$row"
            exit 1
          fi

          printf '%s\n' "$row" > "$RUNNER_TEMP/row.json"
          echo "Row to append:"
          cat "$RUNNER_TEMP/row.json"

      - name: Append to report series and publish page
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/e2e-history"
          # Token in the remote URL is the documented pattern for the
          # built-in GITHUB_TOKEN. Never echo this, and never `set -x` in
          # this step; Actions masks the value but the URL form makes it
          # trivially easy to leak into an unmasked context.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          pushed=0
          for attempt in 1 2 3 4 5; do
            rm -rf "$WORK"

            # Bootstrap without a chicken-and-egg: `actions/checkout` with
            # `ref: perf-history` hard-fails when the branch does not exist,
            # which is the state of every repository before this job has
            # ever run. Probe first, then either clone it or start an empty
            # history locally and let the push create it.
            if git ls-remote --exit-code --heads "$REMOTE" perf-history >/dev/null 2>&1; then
              git clone --quiet --branch perf-history --single-branch --depth 1 "$REMOTE" "$WORK"
            else
              echo "perf-history does not exist yet -- creating it"
              mkdir -p "$WORK"
              git -C "$WORK" init --quiet --initial-branch perf-history
              git -C "$WORK" remote add origin "$REMOTE"
            fi

            git -C "$WORK" config user.name "github-actions[bot]"
            git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Everything this job owns lives under `e2e/`. The branch root is
            # the perf tenant's directory - `perf-trend` owns `ci-history.jsonl`
            # and `index.html` there - and writing the E2E series to the root
            # would put two unrelated measurement populations in one directory,
            # which is what ADR-074 exists to prevent.
            SERIES="$WORK/e2e/e2e-history.jsonl"
            mkdir -p "$WORK/e2e"
            cat "$RUNNER_TEMP/row.json" >> "$SERIES"

            # Prune to the newest 30 rows in this same commit, so the branch
            # does not grow without bound and the page never has to defend
            # against an unbounded fetch. Via a temporary file, not in place:
            # `tail -n 30 "$SERIES" > "$SERIES"` would truncate the file
            # before `tail` had read a byte of it.
            tail -n 30 "$SERIES" > "$SERIES.pruned"
            mv "$SERIES.pruned" "$SERIES"

            # Copied unconditionally so the page tracks `main`. This is why
            # the page must be edited at tools/e2e/report-page.html and never
            # on the orphan branch.
            cp tools/e2e/report-page.html "$WORK/e2e/index.html"

            # Pages serves through Jekyll unless told not to, which would drop
            # any future underscore-prefixed file without explanation. Created
            # only when absent, because it sits at the branch root, which this
            # job does not own: on this repository `perf-trend` has already
            # committed it, so the guard matters only on the bootstrap path
            # where the branch does not exist yet. One `.nojekyll` at the root
            # covers the whole branch, so `e2e/` needs no second copy.
            [[ -f "$WORK/.nojekyll" ]] || touch "$WORK/.nojekyll"

            git -C "$WORK" add -- e2e/e2e-history.jsonl e2e/index.html .nojekyll
            git -C "$WORK" commit --quiet \
              -m "[EOP-221] chore: record E2E report point for ${COMMIT_SHA}"

            if git -C "$WORK" push --quiet origin "HEAD:refs/heads/perf-history"; then
              pushed=1
              break
            fi

            # Reached when a concurrent run pushed first. The whole clone
            # and append is inside the loop, so the retry replays onto the
            # new tip instead of trying to rebase a detached commit.
            echo "push attempt $attempt failed -- refetching and replaying"
            sleep "$((attempt * 3))"
          done

          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::could not push to perf-history after 5 attempts"
            exit 1
          fi

          points="$(wc -l < "$WORK/e2e/e2e-history.jsonl" | tr -d ' ')"
          echo "perf-history now holds $points E2E data point(s) under e2e/ (capped at 30)"

          {
            echo "### E2E report updated"
            echo ""
            echo "Recorded one data point for \`${COMMIT_SHA}\`. The series now holds $points point(s)."
            echo ""
            echo "Report page: https://$(echo "$REPO" | cut -d/ -f1).github.io/$(echo "$REPO" | cut -d/ -f2)/e2e/"
          } >> "$GITHUB_STEP_SUMMARY"

  perf-trend:
    name: perf-trend
    needs: image
    # Pushes to `main` only. `github.event_name == 'push'` is load-bearing
    # and not redundant with the ref test: `workflow_dispatch` and the weekly
    # `schedule` trigger both report `refs/heads/main` too, and a scheduled
    # re-run of unchanged code would otherwise append a duplicate point for
    # a commit already in the series. A pull request must never append -
    # the code is unmerged, so a point recorded against it describes a state
    # of the tree that may never exist on `main`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One of two jobs in this workflow that can write to the repository - the
    # other is `e2e-report` - and both write to exactly one branch that holds
    # no code. This job owns the branch root; `e2e-report` owns `e2e/`.
    permissions:
      contents: write
    # Serialise, and never cancel. Two merges in quick succession would race
    # on the push to `perf-history`; `cancel-in-progress: false` because the
    # queued run carries a data point that is not recoverable if dropped -
    # the artifact it reads is scoped to its own workflow run.
    concurrency:
      group: perf-trend
      cancel-in-progress: false
    steps:
      # Needed only for tools/perf/trend-page.html. The trend series itself
      # lives on the orphan branch and is fetched separately below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download k6 results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: k6-results
          path: k6-results

      # Reads the artifact, never the workspace. `test/k6/results/` is
      # gitignored (.gitignore:83), so it is absent from a fresh checkout -
      # looking for the summary there would make the guard below always
      # false and this job green while recording nothing, which is the
      # exact failure mode ADR-016 documents for the InfluxDB writes.
      - name: Extract trend row
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          SUMMARY="k6-results/summary.json"

          if [[ ! -s "$SUMMARY" ]]; then
            echo "::error::$SUMMARY missing or empty in the k6-results artifact -- the canary passed but exported nothing, so the trend series cannot be appended to"
            ls -R k6-results || true
            exit 1
          fi

          # Key spellings verified against a real export before use. The
          # document is flat: there is no `.values` wrapper at any level.
          # `error_rate` reads `.value` because `http_req_failed` is an
          # inverted Rate whose `passes`/`fails` are 0/221 on a fully
          # healthy run -- using those would record a 100% error rate for
          # every green build.
          row="$(jq -c \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha "$COMMIT_SHA" \
            --arg run_id "$RUN_ID" '
              .metrics as $m
              | {
                  date:       $date,
                  sha:        $sha,
                  run_id:     $run_id,
                  p50:        $m.http_req_duration["p(50)"],
                  p95:        $m.http_req_duration["p(95)"],
                  p99:        $m.http_req_duration["p(99)"],
                  max:        $m.http_req_duration.max,
                  rps:        $m.http_reqs.rate,
                  error_rate: $m.http_req_failed.value,
                  iterations: $m.iterations.count,
                  checks:     "\($m.checks.passes)/\($m.checks.passes + $m.checks.fails)"
                }
            ' "$SUMMARY")"

          # Fail loudly on a partial row rather than committing nulls. jq
          # emits `null` for a key that has moved or been renamed, and a
          # series quietly filling with nulls looks healthy in CI and is
          # useless by the time anyone reads the chart.
          #
          # The numeric fields are wrapped in an array and tested with
          # `all(...)` deliberately. The obvious spelling - a bare
          # `(.p50, .p95, ... | type == "number")` - is a jq *stream* of one
          # boolean per field, and `jq -e` derives its exit status from the
          # LAST value only, so a null in any position but the final one
          # exits 0. That was verified by negative test: nulling `.p95`
          # passed the comma form and is correctly rejected by this one.
          if ! printf '%s' "$row" | jq -e '
                ([.p50, .p95, .p99, .max, .rps, .error_rate, .iterations]
                  | all(type == "number" and (isnan or isinfinite | not)))
                and (.checks | test("^[0-9]+/[0-9]+$"))
                and (.sha | test("^[0-9a-f]{40}$"))
                and (.run_id | test("^[0-9]+$"))
                and (.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              ' >/dev/null; then
            echo "::error::extracted row failed validation -- a metric key has probably moved in the k6 summary export"
            printf '%s\n' "$row"
            exit 1
          fi

          printf '%s\n' "$row" > "$RUNNER_TEMP/row.json"
          echo "Row to append:"
          cat "$RUNNER_TEMP/row.json"

      - name: Append to trend series and publish page
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/perf-history"
          # Token in the remote URL is the documented pattern for the
          # built-in GITHUB_TOKEN. Never echo this, and never `set -x` in
          # this step; Actions masks the value but the URL form makes it
          # trivially easy to leak into an unmasked context.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          pushed=0
          for attempt in 1 2 3 4 5; do
            rm -rf "$WORK"

            # Bootstrap without a chicken-and-egg: `actions/checkout` with
            # `ref: perf-history` hard-fails when the branch does not exist,
            # which is the state of every repository before this job has
            # ever run. Probe first, then either clone it or start an empty
            # history locally and let the push create it.
            if git ls-remote --exit-code --heads "$REMOTE" perf-history >/dev/null 2>&1; then
              git clone --quiet --branch perf-history --single-branch --depth 1 "$REMOTE" "$WORK"
            else
              echo "perf-history does not exist yet -- creating it"
              mkdir -p "$WORK"
              git -C "$WORK" init --quiet --initial-branch perf-history
              git -C "$WORK" remote add origin "$REMOTE"
            fi

            git -C "$WORK" config user.name "github-actions[bot]"
            git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            cat "$RUNNER_TEMP/row.json" >> "$WORK/ci-history.jsonl"

            # Copied unconditionally so the page tracks `main`. This is why
            # the page must be edited at tools/perf/trend-page.html and never
            # on the orphan branch.
            cp tools/perf/trend-page.html "$WORK/index.html"
            # Pages serves through Jekyll unless told not to, which would
            # drop any future underscore-prefixed file without explanation.
            touch "$WORK/.nojekyll"

            git -C "$WORK" add ci-history.jsonl index.html .nojekyll
            git -C "$WORK" commit --quiet \
              -m "[EOP-169] chore: record k6 trend point for ${COMMIT_SHA}"

            if git -C "$WORK" push --quiet origin "HEAD:refs/heads/perf-history"; then
              pushed=1
              break
            fi

            # Reached when a concurrent run pushed first. The whole clone
            # and append is inside the loop, so the retry replays onto the
            # new tip instead of trying to rebase a detached commit.
            echo "push attempt $attempt failed -- refetching and replaying"
            sleep "$((attempt * 3))"
          done

          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::could not push to perf-history after 5 attempts"
            exit 1
          fi

          points="$(wc -l < "$WORK/ci-history.jsonl" | tr -d ' ')"
          echo "perf-history now holds $points data point(s)"

          {
            echo "### k6 trend updated"
            echo ""
            echo "Recorded one data point for \`${COMMIT_SHA}\`. The series now holds $points point(s)."
            echo ""
            echo "Trend page: https://$(echo "$REPO" | cut -d/ -f1).github.io/$(echo "$REPO" | cut -d/ -f2)/"
          } >> "$GITHUB_STEP_SUMMARY"

  # Supply-chain tripwire for the OpenCode plugin roster. This job exists
  # because the prose version of it did not work: SETUP.md carried a
  # "re-run `npm audit` whenever a pin moves" instruction that fired four
  # times and was honoured once, and one of the firings it missed was a
  # commit that edited the very paragraph recording the trigger as
  # unhonoured. Prose does not run. This job does.
  #
  # What it guards is not the shipped Java application - that has no npm
  # dependencies at all. It guards the plugins pinned in the `plugin`
  # array of `.opencode/opencode.json`, which load in-process inside
  # OpenCode with sight of every message and file on a developer machine
  # and no sandbox. That is a wider blast radius than anything in `pom.xml`,
  # and until now it was the only dependency set with no automated check.
  #
  # Deliberately NOT a required status check, and since 2026-09-05 the only
  # dependency gate that is not. The required gates on `main` - `build`, the
  # two Sonar ratchets since 2026-09-04, and `dependency-cve` since
  # 2026-09-05 - are all about the code that ships: a new advisory published
  # against a transitive dependency of a developer tool is a thing to know
  # about, not a reason to block a merge of unrelated application code. Read
  # that as a statement about blast radius and not as one about CVE gates
  # being unfit to block, because `dependency-cve` reads the same kind of
  # advisory feed against dependencies that users execute, and it blocks. Let
  # this one run as an ordinary job, watch it, and promote it only if that
  # judgement turns out to be wrong.
  #
  # Failure conditions are drift and severity, in that order of interest:
  # a maintainer account change, a provenance-attestation change, a roster
  # spec that lost its exact version, or a high/critical advisory. Low and
  # moderate findings are reported and tolerated - SETUP.md holds the
  # accepted residual and the reasons.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    # Reads the registry and the repository. Writes nothing anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The container audit runs first, before the Node setup, because it needs
      # neither Node nor npm -- only `git`, `python3` and `docker buildx`, all
      # present on ubuntu-latest. Putting it here means a malformed or
      # undeclared container pin reports in seconds instead of waiting on a
      # toolchain install it does not use (ADR-064).
      - name: Audit digest-pinned containers
        run: tools/supply-chain/audit-containers.sh

      # The Actions audit is the third population in this job and the cheapest:
      # it reads the checked-out tree and its own baseline and makes no network
      # call at all, so it costs milliseconds (EOP-236, ADR-073). `if: always()`
      # for the same reason the plugin audit carries it -- three independent
      # populations, and a reader needs all three verdicts from one run rather
      # than the first one to fail.
      #
      # Unlike the other two, one of its checks does not consult the baseline:
      # any `uses:` reference that is not a 40-hex commit SHA fails outright, so
      # the next action added by tag fails on its first commit instead of
      # passing silently until somebody remembers to declare it.
      - name: Audit pinned GitHub Actions
        if: always()
        run: tools/supply-chain/audit-actions.sh

      # No `cache: npm` here, and that is deliberate rather than an
      # oversight. The manifest this job audits is generated at run time
      # from the pinned specs and there is no lockfile to key a cache on;
      # more to the point, a cached dependency tree is exactly the wrong
      # thing for an audit that is supposed to observe what the registry
      # serves today.
      #
      # `if: always()` for the same reason as the plugin audit below: if the
      # container audit failed, this setup must still run, or the plugin audit
      # would fall back to whatever Node the runner image happens to ship.
      - name: Set up Node 22
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # `if: always()` so that a container finding above cannot hide plugin
      # drift here. The two audits are independent populations and a reader
      # needs both verdicts from one run, not the first one to fail.
      # The gating logic inside audit-plugins.sh decides whether an npm advisory
      # blocks this job, and until 2026-09-04 nothing re-ran the transcript that
      # demonstrated it working. tools/supply-chain/test-audit-plugins.sh has
      # existed since that audit landed but was never wired into any workflow, so
      # it was a control nobody ran. It needs only python3 and the checked-out
      # tree -- no npm, no network -- so it costs seconds and runs before the
      # audit it guards, failing fast when the policy itself is broken.
      #
      # Caveat worth knowing: this harness carries its own copy of the Python
      # block rather than extracting it from audit-plugins.sh, so it cannot
      # detect a break in the shipped script. Converting it to the extraction
      # used by test-scan-dependencies.sh is a tracked follow-up (EOP-147).
      - name: Test the advisory-gating logic
        run: tools/supply-chain/test-audit-plugins.sh

      - name: Audit pinned OpenCode plugins
        if: always()
        run: tools/supply-chain/audit-plugins.sh

  # CVE scanning for the two dependency trees the application actually
  # ships: the Maven tree resolved from `pom.xml`, and the npm tree locked
  # by `ui/package-lock.json`. Before EOP-89 there was none, anywhere - the
  # enforcer covered dependency *convergence* and banned coordinates, which
  # is supply-chain hygiene but is not CVE detection, so a transitive with a
  # published critical passed every gate the project had. It was not a
  # theoretical gap: the first run of this scanner against `main` found six
  # findings, one of them a HIGH in a directly-declared runtime dependency
  # (`org.postgresql:postgresql`, CVE-2026-54291). All six were closed by
  # patch-level version overrides in `pom.xml` before this job landed, which
  # is why it is green on arrival - a gate that is red the day it appears
  # gets switched off rather than fixed.
  #
  # Note the division of labour with `supply-chain` above, which is a
  # different job about a different tree and is not redundant with this one.
  # That one audits the OpenCode *developer plugins* and checks more than
  # CVEs there (maintainer continuity, provenance attestations, npm
  # signatures); this one audits the *deployed application* and checks only
  # CVEs. This job therefore skips `.opencode/` and `tools/` deliberately:
  # two gating scanners over one tree would mean two allowlists to keep in
  # step, and the first divergence would be silent.
  #
  # A REQUIRED status check since 2026-09-05, having arrived on 2026-08-22 as
  # an advisory one. The four preconditions the promotion was made to wait on
  # (EOP-149) were all met, and two of them were met by events rather than by
  # argument. The failure policy was exercised in anger on 2026-09-03, when
  # three freshly disclosed CRITICALs against embedded Tomcat turned `main`
  # red on two unrelated merges - one of them documentation-only - and were
  # closed by a `<tomcat.version>11.0.25</tomcat.version>` override rather
  # than by an allowlist entry (EOP-189), which is the order of preference
  # ADR-050 states. And the false-positive rate is measured rather than
  # assumed: over the 60 runs of this job on `main` between 2026-08-22 and
  # 2026-09-05, 58 passed and the only two failures were that one genuine
  # disclosure. Nought false positives, including nought from the one known
  # false-positive class - an H2 advisory, which this scanner would gate on
  # because it reads the resolved tree and so does not honour ADR-047's
  # exclusion of H2 from the deployable jar.
  #
  # That 2026-09-03 incident is also, honestly, an instance of the hazard
  # that kept this job advisory in the first place, and promoting it does not
  # dissolve that hazard: a CVE gate goes red on a publication by a third
  # party against code that has not changed, so a required one lets someone
  # else's release schedule block an unrelated pull request. What changed is
  # the judgement about which risk is worse. `main` stood red for roughly
  # seven hours that day with nothing blocking a merge on top of it, and the
  # sibling `sonar-ratchet` case recorded in ADR-060 shows where that ends:
  # a gate that is visible but not binding gets rescued by whoever happens
  # to look.
  #
  # The escape hatch is therefore a documented one, and it is the allowlist
  # rather than a person: `tools/supply-chain/accepted-cves.json`, whose
  # entries carry a reachability trace, a reviewer, a date and a mandatory
  # `expires`, so a suppression is reviewable in the diff and retires itself.
  # The order of preference is the upgrade first (ADR-050), then a time-boxed
  # allowlist entry, and only if a fix and a defensible trace are both out of
  # reach, an administrator lifting the requirement - recorded in the pull
  # request, because nothing else would record it. That last route is last on
  # purpose: it leaves no artefact in the repository, and the token available
  # to contributors and agents here cannot even read the branch-protection
  # settings, so a lift that was never reinstated would be invisible.
  #
  # Note the job carries no `if:` condition and so runs on every event. That
  # is a precondition of being required rather than an incidental detail: a
  # required check that can be skipped leaves a pull request permanently
  # unmergeable, so adding a path filter or an event guard here would break
  # branch protection rather than merely narrowing the job.
  #
  # Two honest caveats, the first sharper now that the check is required.
  # Branch protection is configured outside this file, so no comment here can
  # make the job required or stop it being required - this paragraph records
  # an intent that only the repository settings enforce, and the two can
  # drift apart silently. And the job exits non-zero and shows red on a
  # gating finding either way, so "required" affects whether a merge is
  # blocked, never whether the finding is visible.
  #
  # Failure policy, in full, is HIGH and CRITICAL only. That matches the
  # `audit-plugins.sh` gating set exactly and diverges from the SpotBugs
  # posture in `build-quality.md`, which fails on high *and medium*. The
  # divergence is deliberate: a medium SpotBugs finding is in our own code
  # and is always actionable, whereas a medium CVE in a third-party
  # transitive is frequently unreachable, often has no in-range fix, and
  # arrives at a volume set by other people's release cadence. Medium and
  # low findings are printed in their own non-gating section. See ADR-050 as
  # amended 2026-09-05.
  dependency-cve:
    name: dependency-cve
    runs-on: ubuntu-latest
    # Reads the repository, the vulnerability database and Maven Central.
    # Writes nothing anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No `setup-node`: Trivy reads `ui/package-lock.json` as a file rather
      # than installing it, so the npm half of this job needs no Node.
      #
      # A JDK and a warm `~/.m2/repository`, however, are a prerequisite,
      # and the first version of this job learned that the hard way. Trivy
      # resolves the Maven tree with its own parser rather than invoking
      # Maven, which reads as "no JDK needed" and is true of the parser but
      # false of the job: that parser has no cache of its own, so it
      # re-fetches every parent POM and BOM over HTTP on every single run.
      # From a shared GitHub Actions IP address that is enough to earn a
      # `429 Too Many Requests` from Maven Central with a 1800-second
      # `Retry-After`, which is exactly what happened on the first run of
      # this job (EOP-89) - on `spring-data-bom`, with the whole tree still
      # to go. Populating the local Maven repository first removes almost
      # all of that traffic, because Trivy reads `~/.m2/repository` when it
      # is present and only goes to the network for what is missing.
      #
      # What this is NOT is `--offline-scan`. That flag would stop Trivy
      # reaching the network at all, and a parent POM it could not resolve
      # would silently reduce the dependency tree it believes exists - an
      # under-report presented as a clean scan, which is the one failure
      # mode this whole design refuses. The network remains reachable and a
      # resolution failure remains a loud exit 2. Warming the cache is a
      # way of not provoking the rate limiter, not a way of tolerating it.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # Distinct save key, shared restore prefix. The `build` job caches the
      # same directory under `${{ runner.os }}-maven-<pom hash>`; the bare
      # `${{ runner.os }}-maven-` restore prefix below matches that entry, so
      # this job starts from whatever `build` last saved instead of
      # populating a second copy from cold. The save key differs so that two
      # jobs in the same run do not race to write one key.
      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-cve-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # `dependency:resolve` rather than a full `verify`: this job has no
      # business compiling or testing anything, it only needs the POMs and
      # artifacts on disk so Trivy's parser finds them locally. If Central
      # throttles *this* step the job fails here, before the scan, which is
      # still the safe direction - a failed resolve is visibly a failed
      # resolve, not a clean bill of health.
      #
      # `-B` but deliberately NOT `-q`. Quiet mode suppresses exactly the
      # per-artifact INFO lines that named `spring-data-bom` as the artefact
      # Central refused, and that incident was diagnosed from this log. A
      # throttled resolve fails loudly either way; the question is whether the
      # log says *which* POM and *what* the HTTP status was, or only that
      # Maven exited non-zero. Keep the output. The verbosity costs nothing
      # that matters in a job whose whole purpose is telling someone what is
      # wrong with a dependency tree.
      - name: Populate the local Maven repository for Trivy's parser
        run: ./mvnw -B dependency:resolve

      # Pinned by version *and* by the SHA-256 of the release asset, rather
      # than installed through a third-party action. Both halves are
      # deliberate. A `setup-trivy`-style action would add another
      # unpinned-by-default dependency to the very job whose purpose is
      # dependency hygiene; and pinning only the version still trusts
      # whatever bytes that tag serves today. What the digest does and does
      # not prove is worth being exact about: it detects a corrupted
      # download or a tampered mirror, and it does NOT prove the release
      # itself is benign - if upstream published a backdoored 0.74.0, this
      # check passes. Bumping the version means replacing both values
      # together, from
      # https://github.com/aquasecurity/trivy/releases/download/v<ver>/trivy_<ver>_checksums.txt
      - name: Install Trivy 0.74.0
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          curl -sSfL -o "$asset" "$url"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum --check --strict
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy "$asset"
          trivy --version

      # The vulnerability database is ~109 MiB and is the single largest
      # cost in this job, so it is cached - but note what the cache is and
      # is not. It is an optimisation, never a correctness control: Trivy
      # checks the database's own age and refreshes it when stale, so a
      # cache hit reduces bytes transferred rather than pinning the job to
      # yesterday's advisories. That is why the key must NOT be
      # `hashFiles('**/pom.xml')`, the reflex for a Maven cache - the
      # database ages on a clock of its own, entirely independently of
      # whether our dependencies changed, and keying it to `pom.xml` would
      # hold a stale database for as long as nobody edited the POM.
      #
      # Keyed by UTC date so the full download happens at most once a day,
      # with a bare prefix restore-key so a first-run-of-the-day miss still
      # restores yesterday's database and updates it incrementally instead
      # of pulling the whole thing.
      - name: Compute cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.cache-date.outputs.date }}
          restore-keys: trivy-db-

      # Two passes, and the second one cannot fail the job. Trivy's default
      # is to suppress development and test dependencies, so pass one sees
      # only what ships and is the pass that gates; pass two re-runs with
      # `--include-dev-deps` and prints whatever is visible only at build
      # time - the UI's dev tree is 331 of its 337 packages, and a finding
      # in a test-scoped Maven artifact never reaches production. Knowing
      # about those is useful; blocking on them is not. Both passes, the
      # allowlist gating and the exit-code contract (0 clean, 1 gating
      # finding or allowlist drift, 2 could not run) live in the script, so
      # the same command reproduces this job locally.
      #
      # Runtime, measured on EOP-89: the scan itself is 4.75 s warm, plus
      # roughly 6 s of database download on a cold cache, plus about 3 s for
      # the `dependency:resolve` step above once `~/.m2/repository` is warm.
      # It is not the reason the CI wall clock is what it is, and needs no
      # scheduled-only treatment - though the workflow's weekly cron covers
      # this job too, which is the trigger that catches an advisory
      # published against dependencies we have not touched.
      # The gating logic inside scan-dependencies.sh decides whether a HIGH or
      # CRITICAL CVE blocks a merge, and it enforces six distinct failure modes
      # over tools/supply-chain/accepted-cves.json. All six were demonstrated by
      # hand once during EOP-89 and nothing re-ran them (EOP-147); this harness
      # does, against synthetic Trivy JSON fixtures. EOP-146 added five further
      # cases that drive the shipped script end to end with a stub `trivy` on
      # PATH to hold its documented 0/1/2 exit contract - the shell control flow
      # the extracted-heredoc cases cannot reach. Sixteen cases in total.
      #
      # It runs BEFORE the scan deliberately. The harness needs neither the real
      # Trivy binary nor the vulnerability database -- it awk-extracts the gate's
      # Python heredoc out of the shipped script and drives it with fixture
      # reports, and stubs `trivy` for the exit-contract cases -- so a broken
      # policy fails here in seconds rather than after the scan.
      #
      # Extraction rather than duplication is the load-bearing choice: it is what
      # makes a deliberate break of scan-dependencies.sh turn these tests red,
      # demonstrated by changing GATING to {"CRITICAL"} and watching the harness
      # drop from 11/11 to 5/11 back when it had eleven cases. A harness holding
      # its own copy would have stayed green, which is exactly the limitation of
      # test-audit-plugins.sh above.
      - name: Test the CVE-gating logic
        run: tools/supply-chain/test-scan-dependencies.sh

      - name: Scan application dependency trees for known CVEs
        run: tools/supply-chain/scan-dependencies.sh

  # A ratchet on SonarQube's issue counts: the three Clean Code software
  # qualities (RELIABILITY, MAINTAINABILITY, SECURITY) may go down or stay
  # level, never up. It exists because the project had no static-analysis
  # trend at all - Checkstyle, SpotBugs and JaCoCo each gate an absolute
  # threshold, which catches the individual violation and says nothing about
  # whether the total is drifting upward one tolerated finding at a time.
  # The measured starting point was 11 / 232 / 0 (EOP-181), so the ceiling
  # is where the code actually is rather than an aspiration, and the job is
  # green on arrival - a gate that is red the day it appears gets switched
  # off rather than fixed.
  #
  # The striking thing about this job is what it does NOT do: it never talks
  # to a SonarQube server. There is no service container, no `sonar-scanner`,
  # no `SONAR_TOKEN`, and no network call of any kind. That is not a
  # simplification, it is the design, and it was chosen after establishing
  # that the two obvious alternatives are both worse here. An offline
  # scanner CLI does not exist any more - SonarQube removed dry-run/preview
  # mode in 5.2, so a modern scanner must reach a server to fetch quality
  # profiles and submit its analysis. Booting an ephemeral SonarQube inside
  # the job does work, and was measured at roughly 60-120 s of startup
  # before the scan even begins, for a total in the 5-6 minute range on
  # every pull request. Instead the analysis happens once, locally, on the
  # machine of whoever changed the code, and its result is committed:
  # `tools/sonar/sonar-report.json` is the scan output and
  # `tools/sonar/sonar-baseline.json` is the ceiling. This job only compares
  # two JSON files, which is why it needs neither a JDK nor Node nor a
  # container runtime and finishes in about a second.
  #
  # That design has one obvious hole and one non-obvious consequence, and
  # both are worth stating plainly rather than discovering later.
  #
  # The hole is staleness. A committed report describes the tree it was
  # generated from, so a developer who edits code and never rescans would
  # otherwise keep a permanently green gate - the gate would be theatre.
  # `tools/sonar/source-hash.sh` closes it: the report carries a
  # `sourceHash` over `pom.xml` plus every `*.java` under `src/main/java`
  # and `src/test/java`, this job recomputes it from the checked-out tree,
  # and a mismatch fails with the rescan recipe. The single definition lives
  # in that one sourced file precisely so the local and CI sides cannot
  # drift into disagreeing about what the token is.
  #
  # The consequence is that any change under those paths requires a local
  # rescan before this job passes. We judged that inherent to the
  # requirement rather than an artifact of the design - a developer has to
  # scan to know whether they added an issue - and it has a pleasant
  # corollary: a docs-only, workflow-only or `ui/`-only pull request leaves
  # the hash untouched and passes instantly, because none of those paths is
  # scanned. The `ui` job above owns TypeScript, and extending Sonar to it
  # is deliberately deferred.
  #
  # What this job does not prove, in three parts. It does not prove the code
  # is good; it proves three integers did not increase. It does not prove
  # the report is honest - a hand-edited `sonar-report.json` would pass, and
  # the hash closes the *accident* of forgetting to rescan rather than the
  # *intent* to lie, exactly as `tools/supply-chain/accepted-cves.json`
  # leaves intent to review. And it does not prove SonarQube's opinion is
  # stable: an upgrade ships retuned rules, which moves the counts silently
  # and directionally, which is why `compose.sonar.yml` pins the image by
  # digest and the report records the server version. Moving that pin is a
  # baseline-invalidating change and needs a re-measure in the same commit.
  #
  # Note the division of labour with the `build` job, which is not redundant
  # with this one and must not absorb it. `build` runs `./mvnw verify` and
  # owns Checkstyle, SpotBugs, JaCoCo and the documentation-integrity tests.
  # Sonar is deliberately NOT wired into `verify`: `sonar-maven-plugin` is
  # invoked fully qualified from `tools/sonar/scan.sh` and appears nowhere in
  # `pom.xml`, so a local build stays fast and a source edit cannot turn
  # `./mvnw verify` red for want of a rescan.
  #
  # A REQUIRED status check since 2026-09-04, having arrived as an advisory
  # one. The original reasoning was that the failure mode nobody had lived
  # with was the stale-report block - the first few times someone pushes a
  # one-line Java fix and is told to boot a container and rescan, we wanted
  # that to be an annoyance rather than a merge blocker, so the friction
  # could be measured before it was mandatory. The friction was then
  # measured, and what the measurement produced was not an over-strict gate
  # but the opposite failure: PR #362 merged with this job red, and `main`
  # stayed red across two further merges for about a day, because nothing
  # blocked. A gate that is visible but not binding was rescued by whoever
  # happened to look. See ADR-060 as amended 2026-09-04.
  #
  # The same two honest caveats apply, and the first is sharper now that the
  # check is required. Branch protection is configured outside this file, so
  # no comment here can make the job required or stop it being required -
  # this paragraph records an intent that only the repository settings
  # enforce, and the two can drift apart silently. And the job exits
  # non-zero and shows red on a regression either way, so "required"
  # affects whether a merge is blocked, never whether the regression is
  # visible.
  #
  # Note the job carries no `if:` condition and so runs on every event. That
  # is a precondition of being required rather than an incidental detail: a
  # required check that can be skipped leaves a pull request permanently
  # unmergeable, so adding a path filter or an event guard here would break
  # branch protection rather than merely narrowing the job.
  #
  # The exit-code contract (0 clean, 1 regression or stale report, 2 could
  # not run) and the whole comparison live in the script, so the same one
  # command reproduces a failure locally with no container and no secrets.
  # See ADR-060.
  sonar-ratchet:
    name: sonar-ratchet
    runs-on: ubuntu-latest
    # Reads two committed JSON files and the source tree it hashes. Writes
    # nothing anywhere, and contacts nothing over the network.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No `setup-java`, no `setup-node`, no cache, and no service
      # container. This job reads JSON and hashes files; `python3` and
      # `sha256sum` are both already on the runner. If a future step here
      # ever needs a JDK, that is a strong signal the job has started doing
      # analysis rather than comparison, which belongs in `scan.sh` instead.
      #
      # `--tighten` is deliberately absent and must stay absent. Lowering
      # the ceiling when a pull request fixes an issue is a local operation
      # that the developer commits, because a PR-triggered job pushing a bot
      # commit back to a contributor branch - a fork, potentially - is a
      # security and a usability hazard for a benefit we can get for free by
      # having `scan.sh` do it before the commit is even made. An
      # improvement is still detected and printed here, it is simply
      # reported rather than written. `tools/sonar/seed-baseline.py` is the
      # only thing that can raise a ceiling and it is never invoked from
      # CI - `grep -rn seed-baseline .github/` matches this comment and
      # nothing else, never a `run:` line, and keeping it a separate file
      # from `ratchet.py` rather than a `ratchet.py --seed` flag is what
      # makes that difference visible to grep at all.
      - name: Compare SonarQube issue counts against the committed baseline
        run: tools/sonar/ratchet.sh

  # The same gate for the front end, over a second SonarQube project
  # (`eop-threat-modeling-ui`) with its own report, its own baseline and its
  # own freshness token. Every caveat on the job above applies here verbatim
  # and is not repeated: three integers rather than a judgement, a hash that
  # closes the accident of forgetting to rescan rather than the intent to
  # lie, a digest-pinned server whose upgrade invalidates the baseline, and
  # `--tighten` deliberately absent so no CI job can lower a ceiling.
  #
  # Why a second project and not one polyglot project. A single project would
  # sum Java and TypeScript findings into one set of three integers, and a
  # ceiling over that sum lets a front-end regression be paid out of Java
  # headroom - the number would still move truthfully while meaning nothing
  # about either population. Two projects also mean two independent
  # freshness tokens, so a Java-only commit leaves the front-end report fresh
  # and a `ui/`-only commit leaves the Java one fresh, and neither language's
  # authors are asked to boot a container for the other's change.
  #
  # `needs:` is deliberately absent, on this job and on its Java counterpart.
  # Neither reads the other's artefacts and neither can influence the other's
  # result, so chaining them would only serialise two file comparisons and
  # hide the second failure behind the first. Two red jobs naming their own
  # language is the point.
  #
  # Note this job runs no Node and installs nothing: it compares two
  # committed JSON files and hashes source text, so `python3` and `sha256sum`
  # on the runner are the whole toolchain even though the subject is
  # TypeScript. A `setup-node` appearing here would be the same warning sign
  # a `setup-java` would be above - analysis belongs in `tools/sonar/
  # scan-ui.sh`, which needs a live server and therefore runs locally.
  #
  # A REQUIRED status check since 2026-09-04, for the same reason as its Java
  # twin and on the same evidence, which is worth stating plainly because
  # this project has not itself suffered the failure: the measurement that
  # ended the advisory period was taken on the Java ratchet, and this job
  # was made required alongside it rather than waiting for its own incident.
  # The two gates stay symmetrical deliberately - an asymmetry here would
  # mean a front-end regression merges while the equivalent Java one does
  # not, for no reason a contributor could infer. Both caveats in the Java
  # block apply verbatim, above all that branch protection lives outside
  # this file and can drift from this comment silently. See ADR-063 and
  # ADR-060 as amended 2026-09-04.
  sonar-ratchet-ui:
    name: sonar-ratchet-ui
    runs-on: ubuntu-latest
    # Reads two committed JSON files and the front-end source it hashes.
    # Writes nothing anywhere, and contacts nothing over the network.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare front-end SonarQube issue counts against the committed baseline
        run: tools/sonar/ratchet-ui.sh

  # The end-to-end suite. Playwright drives real browsers against the two
  # images the `image` job just built, composed by `compose.e2e.yml`: the
  # production Dockerfile, the production `ui/Dockerfile` with `ui/Caddyfile`
  # baked in, `SPRING_PROFILES_ACTIVE=prod`, TLS on host 8443. It is the only
  # job in this file that exercises the artifact through the same surface a
  # user gets, which is why it is worth minutes (ADR-068, ADR-072).
  #
  # NOT a required status check, and deliberately never one, because it does
  # not run on `pull_request` at all. Three browser projects run serially
  # against one application and one database - `workers: 1`, because both rate
  # limiters key on the client address and the leaderboard reads the whole
  # history (ADR-030) - so the suite costs minutes rather than seconds. Too
  # slow to sit in front of a merge; and a required check that never runs on a
  # pull request would leave every pull request permanently unmergeable, which
  # is the same trap the `dependency-cve` job's comment warns about from the
  # other direction. What EOP-220 buys instead is a post-merge failure that
  # someone is told about, which beats a pre-merge gate nobody can afford to
  # wait for.
  #
  # `needs: [ image ]` does two things. It sequences, because the images have
  # to exist before they can be loaded; and it makes a broken build *skip*
  # this suite rather than fail it, because a dependent job whose need fails
  # is skipped, and the `if:` below is a plain event test containing no
  # `always()` and no `failure()`, so that default survives. A red `image` and
  # a red `e2e` reporting one root cause would be noise.
  #
  # Notification is GitHub's own, and there is deliberately no step here that
  # produces one. GitHub notifies the actor who triggered a failed run -- for a
  # push to `main`, whoever merged -- through whatever channel their own Actions
  # notification settings name. That is what "at zero tooling cost" meant in
  # the story: no third-party email action, no `actions/github-script`, no
  # token beyond the default, nothing to keep working. The residual is stated
  # in ADR-072 rather than hidden: when the person who merges is not the pull
  # request's author, only the merger is notified directly and the author
  # learns of it by watching the repository. The `::error::` annotations this
  # job emits narrow that gap, because an annotation is attached to the commit
  # and visible to anyone who opens it.
  e2e:
    name: e2e
    needs: [ image ]
    # Every event except a pull request. This one line is acceptance criterion
    # 4: a suite that never runs before a merge cannot block one. Note there
    # is no branch guard on `workflow_dispatch`. EOP-220's technical notes
    # suggested restricting it to `main`, and that suggestion was not taken:
    # dispatching this suite from a topic branch is exactly how a change to
    # the suite or to `compose.e2e.yml` gets tested before it merges, and it
    # is harmless because nothing is published from a non-push event - the
    # GHCR steps in `image` are gated on `github.event_name == 'push'`, the
    # images travel as a run-scoped artifact, and the stack is destroyed at
    # the end. A guard here would instead silently skip the job for whoever
    # dispatched it, which is the worse failure mode.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Three browser projects serially, plus a browser install and an image
    # load. A healthy run sits well inside this; the ceiling is here so that a
    # hung page cannot burn an hour of the runner.
    timeout-minutes: 45
    # Reads the repository and one workflow artifact; writes artifacts. No
    # `packages` scope, because the images arrive as an artifact rather than
    # from the registry, and no `contents: write` - this job records nothing
    # in the repository. `perf-trend` and `e2e-report` are the only two jobs
    # here that can, and `e2e-report` is the one that publishes this job's
    # `results.json` after it succeeds.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `e2e/` is a third npm project alongside `ui/`, with its own lockfile
      # and its own Node floor of 22.12. `node-version: 22` resolves to the
      # latest 22.x and so clears that patch floor, exactly as the `ui` job
      # relies on.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install end-to-end dependencies
        run: npm ci

      # Typecheck before spending minutes on browsers. `e2e/` has no ESLint by
      # design; a strict `tsconfig.json` plus this is the whole static gate
      # there, so skipping it would leave the directory ungated.
      - name: Typecheck the suite
        run: npm run typecheck

      # Jobs do not share a Docker daemon, so the images the `image` job built
      # travel as an artifact. This is what makes the suite a test of the
      # artifact we would ship rather than of a second build of the same
      # source: nothing here rebuilds from the working tree.
      - name: Download the images built by the image job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-images
          path: image-export

      - name: Load the images into the runner's daemon
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gunzip -c image-export/app.tar.gz | docker load
          gunzip -c image-export/ui.tar.gz | docker load
          docker image inspect eop-threat-modeling:ci > /dev/null
          docker image inspect eop-ui:ci > /dev/null

      # CI starts the stack itself rather than letting `global-setup.ts` do it,
      # which is what `E2E_REUSE_STACK` exists for: the suite's own teardown
      # runs `down -v`, and a stack that has already been destroyed cannot be
      # asked for its container logs. Owning the lifecycle here means the logs
      # survive a failure long enough to be collected.
      #
      # Only the two image tags need overriding. Every other input in
      # `compose.e2e.yml` carries a default, which is why this job needs no
      # secrets - the repository still has none.
      - name: Start the end-to-end stack
        working-directory: ${{ github.workspace }}
        env:
          APP_IMAGE: eop-threat-modeling:ci
          UI_IMAGE: eop-ui:ci
        run: |
          set -euo pipefail
          docker compose -f compose.e2e.yml up -d --wait --remove-orphans
          docker compose -p eop-e2e ps

      # `E2E_REUSE_STACK` skips the `up` and the teardown inside the suite but
      # keeps its health gate, which polls https://localhost:8443/health from
      # the host until it answers 200 with a body of exactly `OK`. That check
      # is not redundant with `--wait` above: `--wait` proves each container's
      # own healthcheck passes, and says nothing about host port publication
      # or the TLS handshake.
      # The browsers arrive inside a digest-pinned image rather than from
      # `npx playwright install --with-deps`, which downloaded three browser
      # builds from Microsoft's CDN with no content verification and
      # `apt-get install`ed their system libraries as root — the
      # highest-privilege unpinned download in this pipeline (EOP-236,
      # ADR-073). The digest below is the one thing that makes this a pin: the
      # `v1.63.0-noble` tag is mutable, and Playwright pins exact browser
      # revisions per release but does not checksum what the CDN returns, so a
      # version number alone would not have been one. `audit-containers.sh`
      # holds this reference against `expected-containers.json`, so the image
      # cannot be moved or dropped without a reviewed baseline change.
      #
      # The tag is hard-coupled to `@playwright/test` in `e2e/package-lock.json`
      # — Playwright refuses to run against browsers built for another release
      # — so bumping one means bumping both in the same commit.
      # `PlaywrightImagePinTest` fails the build if they disagree.
      #
      # `--network host` is what lets the suite's health gate and every request
      # reach the stack on the host's published 8443; `--ipc host` is
      # Playwright's own recommendation and avoids Chromium exhausting the
      # default 64 MB /dev/shm. The bind mount is `e2e/` alone, which is
      # sufficient because `npm ci` has already populated `e2e/node_modules` on
      # the runner. `-u` matters for the steps that follow rather than for this
      # one: without it `results.json`, `playwright-report/` and
      # `test-results/` land root-owned in the workspace and the three
      # `upload-artifact` steps read them as the runner user. A non-root uid has
      # no passwd entry in the image, so `HOME` is set explicitly or npm writes
      # its cache to `/` and fails.
      #
      # One consequence worth knowing before adding a dependency to `e2e/`: the
      # image ships its own Node — 24.20.0 at this digest — so `npm ci` and
      # `npm run typecheck` above run under the Node 22 that `setup-node`
      # installed, while the suite itself runs under Node 24. That is safe only
      # because `e2e/`'s three devDependencies are pure JavaScript and the
      # browsers come from the image, so nothing is compiled against the
      # installing Node. `engines.node >= 22.12` is satisfied by both. A
      # dependency with a native component would break on exactly this seam.
      - name: Run the Playwright suite
        env:
          E2E_REUSE_STACK: 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            --network host \
            --ipc host \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e E2E_REUSE_STACK \
            --mount type=bind,source="$(pwd)",target=/e2e \
            --workdir /e2e \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            npx playwright test

      # Acceptance criteria 1 and 5, second half: the outcome has to be
      # legible in the run summary, and a failure has to name the scenario
      # that failed. Runs on success too - a green summary is what makes the
      # absence of one on a failure meaningful.
      #
      # It reports the spec title, its file and line, the browser project and
      # the status. It deliberately does NOT copy assertion text into the
      # summary: a failing matcher prints the value it received, and under
      # ADR-071 that value can be a live join code or a player token. The job
      # log already carries it and that exposure is accepted there; widening
      # it into a rendered page is not this step's to decide.
      - name: Report the end-to-end result in the run summary
        if: always()
        run: |
          set -uo pipefail
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          # Silence is the failure mode to design against: k6 taught this file
          # that a green exit code proves nothing about the artefact a later
          # step reads. If the reporter wrote nothing, say so loudly.
          if [ ! -s results.json ]; then
            echo "::error title=End-to-end suite::The suite produced no results.json, so its outcome cannot be reported. Check the run step above and the stack logs artifact."
            {
              echo "## End-to-end suite"
              echo
              echo "No machine-readable result was produced. The suite did not reach its"
              echo "reporter -- most often the stack failed to become healthy. See the"
              echo '`e2e-stack-logs` artifact.'
            } >> "$SUMMARY"
            exit 1
          fi

          PASSED=$(jq -r '.stats.expected // 0' results.json)
          FAILED=$(jq -r '.stats.unexpected // 0' results.json)
          FLAKY=$(jq -r '.stats.flaky // 0' results.json)
          SKIPPED=$(jq -r '.stats.skipped // 0' results.json)
          SECONDS_TAKEN=$(jq -r '((.stats.duration // 0) / 1000) | floor' results.json)

          if [ "$FAILED" -gt 0 ]; then
            HEADLINE="FAILED"
          elif [ "$FLAKY" -gt 0 ]; then
            HEADLINE="PASSED (with retries)"
          else
            HEADLINE="PASSED"
          fi

          {
            echo "## End-to-end suite: $HEADLINE"
            echo
            echo "| Passed | Failed | Flaky | Skipped | Duration |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $PASSED | $FAILED | $FLAKY | $SKIPPED | ${SECONDS_TAKEN}s |"
            echo
          } >> "$SUMMARY"

          # Specs are nested one level per `describe`, so recurse rather than
          # indexing a fixed depth. A spec object is the one that carries both
          # `ok` and `tests`.
          NOT_EXPECTED=$(jq -r '
            [ .. | objects | select(has("specs")) | .specs[]? ]
            | map(select(.ok == false or ((.tests // []) | any(.status == "flaky"))))
            | .[]
            | . as $spec
            | ($spec.tests // [])[]
            | select(.status != "expected" and .status != "skipped")
            | "| `\($spec.file // "?"):\($spec.line // 0)` | \($spec.title) | \(.projectName // "default") | \(.status) |"
          ' results.json)

          if [ -n "$NOT_EXPECTED" ]; then
            {
              echo "### Scenarios that did not pass first time"
              echo
              echo "| Location | Scenario | Browser | Status |"
              echo "| --- | --- | --- | --- |"
              echo "$NOT_EXPECTED"
              echo
              echo "Assertion text is deliberately not reproduced here: a failing matcher"
              echo "prints the value it received, which can be a live join code or a player"
              echo "token (ADR-071). Read it in the run step above, or open the report"
              echo "artifact."
            } >> "$SUMMARY"
          fi

          # An annotation is attached to the commit, so it reaches anyone who
          # opens it rather than only the actor GitHub notifies.
          if [ "$FAILED" -gt 0 ]; then
            echo "::error title=End-to-end suite::$FAILED end-to-end assertion(s) failed against the images built by this run. See the run summary for the scenarios."
          elif [ "$FLAKY" -gt 0 ]; then
            echo "::warning title=End-to-end suite::$FLAKY scenario(s) passed only on retry. A retried pass is reported as flaky, not passed."
          fi

      # Collected while the stack is still up, and before the teardown below
      # destroys it. Every Caddy access line for a join carries a live join
      # code, because the code is a path segment; publishing these inherits
      # ADR-071's acceptance of the artifact channel, and they must not reach
      # any page this repository serves.
      - name: Collect stack logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          mkdir -p e2e-stack-logs
          docker compose -p eop-e2e ps --all > e2e-stack-logs/ps.txt 2>&1 || true
          docker compose -p eop-e2e logs --no-color --timestamps \
            > e2e-stack-logs/all.log 2>&1 || true
          wc -l e2e-stack-logs/*.log || true

      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-stack-logs
          path: e2e-stack-logs/
          if-no-files-found: warn
          retention-days: 7

      # The HTML report and the traces, as a run-scoped artifact and nothing
      # else. ADR-071 is unambiguous that these may not be served from any
      # page this repository publishes: the HTML reporter embeds its whole
      # step tree, and a green run has been measured carrying twelve distinct
      # live join codes in `locator.fill()` step titles. Traces and failure
      # screenshots carry player tokens verbatim.
      #
      # `E2eArtefactPublicationBoundaryTest` fails `./mvnw verify` if this
      # step ever grows a publisher alongside it, so the boundary is enforced
      # by the build rather than by this comment.
      - name: Upload the Playwright report and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      # `results.json` separately, because it is the one artefact ADR-071
      # clears for publication: a length-only assertion in `e2e/game.ts` keeps
      # secrets out of it, and that rule is build-enforced. EOP-221 publishes
      # this file and only this file, which is why it does not travel inside
      # the artifact above.
      - name: Upload the machine-readable result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: e2e/results.json
          if-no-files-found: warn
          retention-days: 14

      # By project name with no `-f`, matching the teardown in `image`, and
      # with `--volumes` so the database is destroyed. A later run on the same
      # runner would get a fresh schema anyway, but the leaderboard scenarios
      # depend on an empty history and leaving the volume behind is how that
      # assumption quietly stops holding.
      - name: Tear down the end-to-end stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -p eop-e2e down --volumes
