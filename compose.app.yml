# Application + PostgreSQL.
#
# Deliberately separate from docker-compose.yml, which runs the k6 / InfluxDB /
# Grafana load-testing stack. The two stacks are independent and either can run
# alone:
#
#   docker compose -f compose.app.yml up -d
#
# The SAME file runs on the EC2 instance. Only environment variables differ, so
# local behaviour predicts deployed behaviour. See
# docs/adr/ADR-012-deployment-target.md.
#
# There is no `build:` section on purpose. The deployment artifact is the image,
# not this directory. Locally, build both images first:
#
#   docker build -t eop-threat-modeling:local .
#   docker build -t eop-ui:local ui
#
# On the instance, APP_IMAGE and UI_IMAGE point at immutable GHCR tags and
# nothing is built at all.
#
# The site is served at https://localhost/ (port 443), not :8080. Caddy is the only
# published entry point. TLS is enabled via `tls internal` in the Caddyfile (EOP-21).

# Project namespace, set explicitly. Without it Compose derives the project name
# from the directory, both files collide, and each stack reports the other's
# containers as orphans - so `docker compose down --remove-orphans` on one file
# would destroy the other stack.
name: eop-app

# Pin the default network subnet so the proxy can have a fixed address for the
# application to allow-list. Without this Compose hands out dynamic IPs.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25

services:
  postgres:
    # Digest-pinned under ADR-064 as amended by EOP-229. The digest is pinned on the
    # *default*, so ${POSTGRES_IMAGE} still overrides it -- an operator who needs a
    # different build says so explicitly instead of inheriting whatever `17-alpine`
    # points at this week. tools/supply-chain/audit-containers.sh now fails on any
    # compose image: line that is not digest-pinned, so removing this digest is a
    # build failure rather than a silent regression. Moving it means re-deriving the
    # baseline entry in the same commit.
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    container_name: eop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # No `ports:` — nothing outside this Compose network can reach the database,
    # not even the host. The application connects over the service name. To
    # inspect it, exec into the container rather than publishing a port.
    volumes:
      # Resolves to a named Docker volume locally, and to an absolute path on
      # the EC2 instance where POSTGRES_DATA_DIR points at a mount backed by a
      # dedicated EBS volume. Keeping the data off the root volume is what makes
      # instance replacement survivable and makes a volume snapshot a complete
      # migration path to another AWS account.
      - ${POSTGRES_DATA_DIR:-eop_postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: ${APP_IMAGE:-eop-threat-modeling:local}
    container_name: eop-app
    restart: unless-stopped
    depends_on:
      postgres:
        # Liquibase runs at startup and `ddl-auto: validate` checks the schema,
        # so the application must never race the database to readiness.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # These OVERRIDE any DATASOURCE_URL in .env, which points at localhost —
      # and inside this container localhost is the container itself, not the
      # database. The host part must be the Compose service name.
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATASOURCE_USER: ${POSTGRES_USER}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Must match the ipv4_address pinned on the caddy service in this same file.
      # A /32 is used so only Caddy is trusted - not the Postgres container or
      # anything else that happens to share the network.
      EOP_WEB_TRUSTED_PROXIES: 172.28.0.10/32
    # No `ports:` either. The application is reachable only through Caddy, on the
    # same origin as the front end. That is the whole point of
    # docs/adr/ADR-017-frontend-delivery-topology.md: the browser never makes a
    # cross-origin request, so no CORS configuration exists anywhere in the
    # codebase. Publishing 8080 as well would create a second, unproxied way in
    # and quietly make the single-origin property untrue.
    #
    # To reach the application directly for debugging, exec into the container or
    # add a temporary override file. Do not add a port here.

  caddy:
    image: ${UI_IMAGE:-eop-ui:local}
    container_name: eop-caddy
    restart: unless-stopped
    depends_on:
      # Only for start ordering. Caddy serves the static site happily without the
      # application; a request to /api would 502 until the app is up, which is
      # the correct behaviour rather than a startup failure.
      - app
    ports:
      # Host 443 -> container 8080. Caddy listens on 8080 because it runs as an
      # unprivileged user and cannot bind below 1024; the privileged port is
      # mapped by the container runtime instead. TLS is terminated at Caddy
      # using `tls internal` (self-signed certificate, EOP-21). APP_BIND keeps
      # the local default at 127.0.0.1, following the InfluxDB precedent in
      # docker-compose.yml; on the EC2 instance it is 0.0.0.0 because the demo
      # has to be reachable, and the security group is what limits access.
      - "${APP_BIND:-127.0.0.1}:443:8080"
    volumes:
      # Persist Caddy's local CA and issued certificates across container
      # recreates (EOP-21). Without this volume the CA is regenerated on every
      # `docker compose up`, which invalidates any previously trusted root and
      # — combined with HSTS — makes the host permanently unreachable in
      # browsers that have already seen the HSTS header. A stable CA means
      # trusting the root once is sufficient for the lifetime of the stack.
      - eop_caddy_data:/data
    networks:
      default:
        ipv4_address: 172.28.0.10

volumes:
  eop_postgres_data:
  eop_caddy_data:
