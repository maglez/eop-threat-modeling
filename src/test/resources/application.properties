# Test-only datasource overrides.
# Keeps ./mvnw test hermetic: no DB_URL/DB_USERNAME/DB_PASSWORD env vars needed.
# (src/test/resources takes precedence over src/main/resources application.yml.)
spring.datasource.url=jdbc:h2:mem:eop-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# spring.h2.console.enabled is deliberately NOT set here (EOP-27). It used to be
# pinned to false, which made any test asserting the console is absent pass because
# of this line rather than because of the shipped default. The suite now inherits
# application.yml, so flipping that default back on breaks the build — which is the
# only version of the assertion worth having.

# springdoc.api-docs.enabled and springdoc.swagger-ui.enabled are deliberately NOT set
# here (EOP-38), for the same reason as spring.h2.console.enabled above. The suite inherits
# the shipped default from application.yml, so flipping that default back on breaks
# SpringdocDisabledByDefaultIntegrationTest. Pinning them here would make that test pass
# because of this file rather than because of what we ship. The test that asserts the
# opt-in still works turns them on with @SpringBootTest(properties) instead.

# Session lifecycle is on for the whole test suite, because a suite that ran with
# the feature off would be testing the absence of it. The one test that asserts
# flag-off behaviour overrides this back to false with @SpringBootTest(properties).
eop.features.session-lifecycle=true

# Trick play is on for the whole test suite, for the same reason. The test that
# asserts the eight beans are absent overrides this back to false with
# @SpringBootTest(properties).
eop.features.trick-play=true

# Session creation rate limit is set to Integer.MAX_VALUE for the test suite so
# that the shared Spring context is not exhausted across integration tests. All
# integration tests call createSession at least once, and the production limit of
# 5 would be hit after the fifth call, causing all subsequent tests to receive 429.
# The unit tests (InMemorySessionCreationLimiterTest) construct the limiter directly
# with the default of 5 and are unaffected by this override.
eop.web.session-creation-limit=2147483647

# Read rate limit is set to Integer.MAX_VALUE for the test suite for the same reason
# as the creation limit above, and the reason is sharper here: every integration test
# issues GETs under /api/v1/**, they all resolve to the same client address (127.0.0.1),
# and the counter lives in a Spring context shared across test classes. The production
# limit of 300 would be consumed part-way through the suite and every later read would
# get a 429 — a failure whose cause is test ordering rather than the code under test.
#
# The tests that DO exercise refusal (ReadRateLimitIntegrationTest) lower the limit for
# their own context with @SpringBootTest(properties = "eop.web.read-rate-limit.limit=N")
# and add @DirtiesContext so the exhausted counter is not inherited by the next class.
# That is deliberate: the limiter key comes from ClientAddressResolver, so isolating a
# test by sending a different X-Forwarded-For would be forging the key — which is the
# EOP-26/ADR-021 vulnerability, not a test technique (EOP-88).
#
# eop.web.read-rate-limit.max-tracked-keys is deliberately NOT set here. The saturation
# path is unit-tested by constructing SlidingWindowCounter directly, so the suite should
# inherit the shipped default rather than pin a value this file owns.
eop.web.read-rate-limit.limit=2147483647
